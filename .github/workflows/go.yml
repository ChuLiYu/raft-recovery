name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-docker-test:
    name: Linux containers (GitHub Actions Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAFT_DOCKER_CONTEXT: default
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker environment
        run: ./raftctl doctor
      - name: Build container images
        run: ./raftctl setup
      - name: Run Linux container tests
        run: ./raftctl test
