# Container-only runtime settings. Each master has its own /data volume.
worker:
  worker_count: 4
  task_timeout: 20s

wal:
  dir: /data/wal
  max_segment_size: 67108864
  sync_interval: 10
  retention_seconds: 86400
  buffer_size: 100
  flush_interval_ms: 10

snapshot:
  dir: /data/snapshot
  interval_seconds: 10
  retention_count: 5

metrics:
  enabled: false
  port: 9090
